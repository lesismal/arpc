name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build for all target platforms
        run: |
          set -e
          for target in \
            linux/amd64 linux/arm64 linux/386 linux/arm \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64 \
            freebsd/amd64 openbsd/amd64 netbsd/amd64; do
            echo "::group::${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
            echo "::endgroup::"
          done

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The minimum version declared in go.mod, plus the latest stable release.
        go: ['1.22.x', stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Test
        # Not PowerShell, the Windows default: it splits "-coverprofile=coverage.out"
        # at the dot and passes ".out" to go test as a package.
        shell: bash
        env:
          # Go 1.22's internal linker omits LC_UUID, which recent macOS dyld rejects.
          GOFLAGS: ${{ runner.os == 'macOS' && matrix.go == '1.22.x' && '-ldflags=-linkmode=external' || '' }}
        run: |
          set -o pipefail
          go test -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test.log

      - name: Report test failures
        # Annotations show up on the run summary, unlike the raw log.
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          grep -E -- '--- FAIL|_test\.go:[0-9]+:|^panic:' test.log | head -20 | while IFS= read -r line; do
            echo "::error title=go test::${line}"
          done

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-arpc
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
