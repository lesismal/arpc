name: build-macos

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: build-macos
    strategy:
      fail-fast: false
      matrix:
        # Use the latest stable Go on macOS: older toolchains link test
        # binaries without an LC_UUID load command, which the newer macos-latest
        # dyld rejects ("missing LC_UUID load command", abort trap).
        go: [stable]
        os: [macos-latest]
    runs-on: ${{ matrix.os}}
    steps:
      - name: install golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: checkout code
        uses: actions/checkout@v4
      - name: go env
        run: |
          printf "$(go version)\n"
          printf "\n\ngo environment:\n\n"
          ulimit -n 30000
          go env
      - name: go test
        run: go test -timeout 60s -coverprofile="./coverage"
